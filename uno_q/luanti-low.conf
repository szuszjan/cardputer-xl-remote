# Tuned for the UNO Q on the CXL Remote virtual 640x480 screen: no GPU there
# (Xorg dummy driver), so 3D is software-rendered on the CPU.
screen_w = 640
screen_h = 480
fullscreen = true
undersampling = 2
viewing_range = 40
fps_max = 25
fps_max_unfocus = 5
smooth_lighting = false
enable_clouds = false
enable_3d_clouds = false
enable_particles = false
enable_minimap = false
enable_dynamic_shadows = false
enable_waving_water = false
enable_waving_leaves = false
enable_waving_plants = false
leaves_style = opaque
connected_glass = false
mip_map = false
bilinear_filter = false
anisotropic_filter = false
gui_scaling = 0.8
hud_scaling = 0.8
